# =============================================================================
# Beacon RAG SFT 训练配置（主实验 v1）
# =============================================================================
model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"

# 数据
train_data_path: "outputs/data/hotpotqa_train_rag.jsonl"
val_data_path: "outputs/data/hotpotqa_val_rag.jsonl"
max_length: 8192

# 训练超参数
per_device_batch_size: 1
grad_accum_steps: 8
learning_rate: 5.0e-5
weight_decay: 0.01
num_epochs: 3
warmup_ratio: 0.05
max_steps: null

# 模型
freeze_llm: false
gradient_checkpointing: true
use_bf16: true

# 日志与保存
exp_name: "beacon_sft_hotpotqa_v1"
output_dir: "outputs"
save_freq_steps: 100
log_freq_steps: 5
seed: 42

# =============================================================================
# Beacon 压缩超参数
# =============================================================================
beacon:
  enable_beacon: true
  beacon_window: 1024
  beacon_ratio: 64
  beacon_param: "q k v"
  beacon_embed_init: "eos"
  beacon_pos: "append"
  beacon_attn: "full-coverage"

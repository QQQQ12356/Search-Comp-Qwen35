# Qwen3.5 原生搜索轨迹 SFT（小步数，单卡复测用）
# 数据：交互式搜索轨迹（think → <search> → <information> → <answer>）
# 目标：验证 SFT 是否教会模型收敛到 </answer>（base 2B 只搜不答）。
model_name_or_path: "Qwen/Qwen3.5-2B"
data_mode: "interactive"
train_data_path: "outputs/data/hotpotqa_train_interactive_sft.jsonl"
max_length: 8192
per_device_batch_size: 1
grad_accum_steps: 8
learning_rate: 5.0e-5
weight_decay: 0.01
num_epochs: 1
warmup_ratio: 0.05
use_bf16: true
save_freq_steps: 100
log_freq_steps: 5
seed: 42
exp_name: "native_qwen3_sft_small_v1"
output_dir: "outputs"
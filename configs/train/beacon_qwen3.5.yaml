# Qwen3.5 Beacon 搜索轨迹 SFT（标准 Trainer）
# 命令行可用 --set key=value 覆盖任意参数，不需要修改本文件。
model_name_or_path: "Qwen/Qwen3.5-2B"
data_mode: "interactive"  # interactive 或 searchr1
train_data_path: "outputs/data/hotpotqa_train_interactive.jsonl"
val_data_path: null         # 可选；设置后 Trainer 按 eval_steps 计算验证 loss
max_length: 8192
per_device_batch_size: 1    # Beacon collator 当前固定为 1
learning_rate: 5.0e-5
weight_decay: 0.01
optim: "adamw_torch"       # 显存紧张可改 adamw_bnb_8bit
lr_scheduler_type: "constant"
warmup_steps: 0
max_grad_norm: 1.0
use_bf16: true
num_epochs: 1
max_train_steps: null       # 非 null 时覆盖 num_epochs
grad_accum_steps: 8
logging_steps: 5
save_freq_steps: 200
eval_steps: 200
seed: 42
exp_name: "beacon_qwen3_sft_v1"
output_dir: "outputs"
use_lora: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
gradient_checkpointing: false  # 显式混合状态路径当前不做层级重计算
beacon:
  enable_beacon: true
  beacon_window: 256
  beacon_stride: 256
  beacon_ratio: 32
  beacon_param: "q k v"
  beacon_embed_init: "eos"
  beacon_pos: "append"
  beacon_attn: "full-coverage"
  # 线性注意力层仅由 Beacon 激活重建 recurrent state；秩越大参数/计算越多。
  beacon_linear_writer_rank: 128
  beacon_loss_chunk_size: 64
  beacon_checkpoint_loss: true
  beacon_cpu_offload_activations: false
  beacon_cpu_offload_threshold: 0

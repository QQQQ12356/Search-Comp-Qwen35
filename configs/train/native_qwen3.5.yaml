# Qwen3.5 原生搜索轨迹 SFT（无 Beacon，标准 Trainer）
# 数据：交互式搜索轨迹（think → <search> → <information> → <answer>）
model_name_or_path: "Qwen/Qwen3.5-2B"
train_data_path: "outputs/data/hotpotqa_train_interactive.jsonl"
val_data_path: null
max_length: 8192
per_device_batch_size: 1
grad_accum_steps: 8
learning_rate: 5.0e-5
weight_decay: 0.01
optim: "adamw_torch"       # 显存紧张可改 adamw_bnb_8bit
lr_scheduler_type: "linear"
max_grad_norm: 1.0
num_epochs: 1
max_train_steps: null
warmup_ratio: 0.05
use_bf16: true
gradient_checkpointing: true
save_freq_steps: 200
log_freq_steps: 5
eval_steps: 200
seed: 42
exp_name: "native_qwen3_sft_v1"
output_dir: "outputs"
